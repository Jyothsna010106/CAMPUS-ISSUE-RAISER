services:
  user-service:
    build: .
    command: npm --prefix services/user-service run start
    environment:
      STORE_MODE: mongo
      USER_SERVICE_MONGO_URI: mongodb+srv://poojarylishmith_db_user:bZit-iYxnS6NSq5@cluster0.csdcgtv.mongodb.net/user_service_db
      USER_SERVICE_PORT: 5001
    ports:
      - "5001:5001"

  section-service:
    build: .
    command: npm --prefix services/section-service run start
    environment:
      STORE_MODE: mongo
      SECTION_SERVICE_MONGO_URI: mongodb+srv://poojarylishmith_db_user:bZit-iYxnS6NSq5@cluster0.csdcgtv.mongodb.net/section_service_db
      SECTION_SERVICE_PORT: 5002
    ports:
      - "5002:5002"

  issue-service:
    build: .
    command: npm --prefix services/issue-service run start
    environment:
      STORE_MODE: mongo
      ISSUE_SERVICE_MONGO_URI: mongodb+srv://poojarylishmith_db_user:bZit-iYxnS6NSq5@cluster0.csdcgtv.mongodb.net/issue_service_db
      ISSUE_SERVICE_PORT: 5003
      USER_SERVICE_URL: http://user-service:5001
    depends_on:
      - user-service
    ports:
      - "5003:5003"

  interaction-service:
    build: .
    command: npm --prefix services/interaction-service run start
    environment:
      STORE_MODE: mongo
      INTERACTION_SERVICE_MONGO_URI: mongodb+srv://poojarylishmith_db_user:bZit-iYxnS6NSq5@cluster0.csdcgtv.mongodb.net/interaction_service_db
      INTERACTION_SERVICE_PORT: 5004
      ISSUE_SERVICE_URL: http://issue-service:5003
    depends_on:
      - issue-service
    ports:
      - "5004:5004"

  evidence-service:
    build: .
    command: npm --prefix services/evidence-service run start
    environment:
      STORE_MODE: mongo
      EVIDENCE_SERVICE_MONGO_URI: mongodb+srv://poojarylishmith_db_user:bZit-iYxnS6NSq5@cluster0.csdcgtv.mongodb.net/evidence_service_db
      EVIDENCE_SERVICE_PORT: 5005
    ports:
      - "5005:5005"

  escalation-service:
    build: .
    command: npm --prefix services/escalation-service run start
    environment:
      STORE_MODE: mongo
      ESCALATION_SERVICE_MONGO_URI: mongodb+srv://poojarylishmith_db_user:bZit-iYxnS6NSq5@cluster0.csdcgtv.mongodb.net/escalation_service_db
      ESCALATION_SERVICE_PORT: 5006
      ISSUE_SERVICE_URL: http://issue-service:5003
      USER_SERVICE_URL: http://user-service:5001
    depends_on:
      - issue-service
      - user-service
    ports:
      - "5006:5006"

  status-service:
    build: .
    command: npm --prefix services/status-service run start
    environment:
      STORE_MODE: mongo
      STATUS_SERVICE_MONGO_URI: mongodb+srv://poojarylishmith_db_user:bZit-iYxnS6NSq5@cluster0.csdcgtv.mongodb.net/status_service_db
      STATUS_SERVICE_PORT: 5007
      ISSUE_SERVICE_URL: http://issue-service:5003
    depends_on:
      - issue-service
    ports:
      - "5007:5007"

  analytics-service:
    build: .
    command: npm --prefix services/analytics-service run start
    environment:
      STORE_MODE: mongo
      ANALYTICS_SERVICE_MONGO_URI: mongodb+srv://poojarylishmith_db_user:bZit-iYxnS6NSq5@cluster0.csdcgtv.mongodb.net/analytics_service_db
      ANALYTICS_SERVICE_PORT: 5008
      ISSUE_SERVICE_URL: http://issue-service:5003
      SECTION_SERVICE_URL: http://section-service:5002
    depends_on:
      - issue-service
      - section-service
    ports:
      - "5008:5008"

  gateway:
    build: .
    command: npm --prefix services/gateway run start
    environment:
      GATEWAY_PORT: 5000
      USER_SERVICE_URL: http://user-service:5001
      SECTION_SERVICE_URL: http://section-service:5002
      ISSUE_SERVICE_URL: http://issue-service:5003
      INTERACTION_SERVICE_URL: http://interaction-service:5004
      EVIDENCE_SERVICE_URL: http://evidence-service:5005
      ESCALATION_SERVICE_URL: http://escalation-service:5006
      STATUS_SERVICE_URL: http://status-service:5007
      ANALYTICS_SERVICE_URL: http://analytics-service:5008
    depends_on:
      - user-service
      - section-service
      - issue-service
      - interaction-service
      - evidence-service
      - escalation-service
      - status-service
      - analytics-service
    ports:
      - "5000:5000"

  frontend:
    build: .
    command: npm --prefix frontend run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - gateway
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "5173:5173"
